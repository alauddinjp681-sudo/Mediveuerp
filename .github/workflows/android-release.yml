name: Android release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      deployFunctions:
        description: Deploy Firebase payment and referral functions
        required: true
        default: false
        type: boolean
      publishRelease:
        description: Publish signed APK and Play Store AAB to GitHub Releases
        required: true
        default: false
        type: boolean
      releaseVersion:
        description: Release tag to create when publishing manually (for example v1.0.1)
        required: false
        default: v1.0.1
        type: string

permissions:
  contents: write

jobs:
  build-android:
    uses: ./.github/workflows/build-apk.yml
    secrets: inherit

  publish-release:
    needs: build-android
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publishRelease
    runs-on: ubuntu-latest
    steps:
      - name: Download signed APK and AAB
        uses: actions/download-artifact@v4
        with:
          pattern: mediveu-release-*
          merge-multiple: true
          path: release

      - name: Publish APK and Play Store bundle
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.releaseVersion }}
          name: MEDIVEU ERP ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.releaseVersion }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/app-release.apk
            release/app-release.aab

  deploy-firebase:
    if: ${{ inputs.deployFunctions }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Cloud Functions
        run: npm ci --prefix functions && npm --prefix functions run lint

      - name: Authenticate to Firebase project
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Set Razorpay secrets in Firebase Secret Manager
        env:
          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
        run: |
          if [ -z "$RAZORPAY_KEY_ID" ] || [ -z "$RAZORPAY_KEY_SECRET" ]; then
            echo "Set RAZORPAY_KEY_ID and RAZORPAY_KEY_SECRET as GitHub Actions secrets before deploying functions."
            exit 1
          fi
          npx --yes firebase-tools@latest functions:secrets:set RAZORPAY_KEY_ID --project mediveuerp --data-file - <<< "$RAZORPAY_KEY_ID"
          npx --yes firebase-tools@latest functions:secrets:set RAZORPAY_KEY_SECRET --project mediveuerp --data-file - <<< "$RAZORPAY_KEY_SECRET"

      - name: Deploy Firebase Functions
        run: npx --yes firebase-tools@latest deploy --only functions --project mediveuerp
